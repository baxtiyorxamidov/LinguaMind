<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — LinguaMind</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(108, 92, 231, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(232, 67, 147, 0.14),
                    transparent 35%
                ),
                #0f1224;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .register-wrapper {
            width: 100%;
            max-width: 460px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 66px;
            height: 66px;

            margin: 0 auto 14px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #8e44ad,
                    #e84393
                );

            box-shadow:
                0 16px 40px
                rgba(108, 92, 231, 0.3);
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .brand p {
            color: #9ea3ba;
            font-size: 14px;
        }

        .register-card {
            background:
                rgba(25, 29, 55, 0.92);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 26px;

            padding: 32px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(18px);
        }

        .register-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9ea3ba;
            font-size: 14px;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 800;

            color: #d9dced;
        }

        input {
            width: 100%;
            padding: 14px 15px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            background: #151832;
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.2s ease;
        }

        input::placeholder {
            color: #72778f;
        }

        input:focus {
            border-color: #7c6cf2;

            box-shadow:
                0 0 0 4px
                rgba(108, 92, 231, 0.12);
        }

        .register-btn {
            width: 100%;

            border: none;

            padding: 14px 18px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #8e44ad
                );

            color: white;

            font-size: 15px;
            font-weight: 900;

            cursor: pointer;

            margin-top: 6px;

            transition: 0.2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(108, 92, 231, 0.28);
        }

        .bottom-text {
            margin-top: 22px;

            text-align: center;

            font-size: 14px;

            color: #9297af;
        }

        .bottom-text a {
            color: #a99cff;
            text-decoration: none;
            font-weight: 800;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }

        .security-note {
            margin-top: 18px;

            text-align: center;

            color: #72778f;

            font-size: 12px;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .register-card {
                padding: 24px 20px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }
    </style>

<!-- LINGUAMIND_GLOBAL_CSRF_BEGIN -->
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
(function () {
    "use strict";
    const SAFE_METHODS = new Set(["GET", "HEAD", "OPTIONS", "TRACE"]);
    function csrfToken() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        return meta ? meta.getAttribute("content") : "";
    }
    function isSameOrigin(url) {
        try {
            return new URL(url, window.location.href).origin === window.location.origin;
        } catch (error) {
            return true;
        }
    }
    if (window.fetch) {
        const originalFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
            init = init || {};
            const method = (init.method || (input instanceof Request ? input.method : "GET") || "GET").toUpperCase();
            const url = input instanceof Request ? input.url : input;
            if (!SAFE_METHODS.has(method) && isSameOrigin(url)) {
                const headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined) || {});
                if (!headers.has("X-CSRFToken")) {
                    headers.set("X-CSRFToken", csrfToken());
                }
                init.headers = headers;
            }
            return originalFetch(input, init);
        };
    }
    if (window.XMLHttpRequest) {
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function (method, url) {
            this.__lmMethod = (method || "GET").toUpperCase();
            this.__lmUrl = url;
            return originalOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function () {
            const method = this.__lmMethod || "GET";
            const url = this.__lmUrl || window.location.href;
            if (!SAFE_METHODS.has(method) && isSameOrigin(url)) {
                try {
                    this.setRequestHeader("X-CSRFToken", csrfToken());
                } catch (error) {
                    console.warn("LinguaMind CSRF header error:", error);
                }
            }
            return originalSend.apply(this, arguments);
        };
    }
})();
</script>
<!-- LINGUAMIND_GLOBAL_CSRF_END -->

</head>

<body>

    <div class="register-wrapper">

        <div class="brand">

            <div class="brand-logo">
                L
            </div>

            <h1>
                LinguaMind
            </h1>

            <p>
                Start your smarter learning journey.
            </p>

        </div>


        <div class="register-card">

            <h2>
                Create your account 🚀
            </h2>

            <p class="subtitle">
                Join LinguaMind and start improving
                your English with AI-powered learning tools.
            </p>


            <form method="POST">

                <!-- CSRF SECURITY -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <div class="form-group">

                    <label for="full_name">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account →
                </button>

            </form>


            <div class="bottom-text">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Sign in
                </a>

            </div>


            <div class="security-note">
                🔒 Protected registration with CSRF security
            </div>

        </div>

    </div>

</body>
</html>
